name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'cursor/lingxin-wechat-clone-e9d1'] # 触发部署的分支

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lingxin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./lingxin

      - name: Build
        run: npm run build
        working-directory: ./lingxin

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './lingxin/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4